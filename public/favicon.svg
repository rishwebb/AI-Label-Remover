<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Cyber Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="2.5" />
  
  <!-- Outer Aperture Shield Ring -->
  <circle cx="32" cy="32" r="21" stroke="url(#shieldGrad)" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Camera Aperture Iris Blades -->
  <!-- Blade 1 -->
  <path d="M32 15 L43 23 L37 32 Z" fill="#22d3ee" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Blade 2 -->
  <path d="M43 23 L45 37 L33 37 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Blade 3 -->
  <path d="M45 37 L36 47 L29 39 Z" fill="#60a5fa" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Blade 4 -->
  <path d="M36 47 L22 44 L26 34 Z" fill="#818cf8" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Blade 5 -->
  <path d="M22 44 L19 30 L30 30 Z" fill="#a78bfa" fill-opacity="0.25" stroke="#c084fc" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Blade 6 -->
  <path d="M19 30 L27 18 L34 26 Z" fill="#06b6d4" fill-opacity="0.3" stroke="#22d3ee" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Surgical Binary Slicing Laser Slash (Diagonal) -->
  <line x1="14" y1="50" x2="50" y2="14" stroke="url(#sliceGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Central Camera Sensor Eye -->
  <circle cx="32" cy="32" r="5" fill="#080d1a" stroke="url(#sliceGrad)" stroke-width="2" />
  <circle cx="32" cy="32" r="2.2" fill="#22d3ee" filter="url(#glow)" />

  <!-- Stealth Corner Accents -->
  <path d="M8 18 V10 H18" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <path d="M56 46 V54 H46" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
</svg>