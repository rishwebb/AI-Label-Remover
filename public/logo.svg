<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 64" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="logoSliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(4, 2)">
    <!-- Background Cyber Squircle -->
    <rect x="2" y="2" width="56" height="56" rx="15" fill="url(#logoBgGrad)" stroke="url(#logoShieldGrad)" stroke-width="2.2" />
    
    <!-- Outer Aperture Shield Ring -->
    <circle cx="30" cy="30" r="19" stroke="url(#logoShieldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />

    <!-- Camera Aperture Iris Blades -->
    <path d="M30 14 L40 21 L35 30 Z" fill="#22d3ee" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-linejoin="round" />
    <path d="M40 21 L42 34 L31 34 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1" stroke-linejoin="round" />
    <path d="M42 34 L34 43 L27 36 Z" fill="#60a5fa" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" stroke-linejoin="round" />
    <path d="M34 43 L21 40 L25 31 Z" fill="#818cf8" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1" stroke-linejoin="round" />
    <path d="M21 40 L18 27 L28 27 Z" fill="#a78bfa" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" stroke-linejoin="round" />
    <path d="M18 27 L25 16 L32 24 Z" fill="#06b6d4" fill-opacity="0.3" stroke="#22d3ee" stroke-width="1" stroke-linejoin="round" />

    <!-- Surgical Binary Slicing Laser Slash -->
    <line x1="13" y1="47" x2="47" y2="13" stroke="url(#logoSliceGrad)" stroke-width="2.8" stroke-linecap="round" filter="url(#logoGlow)" />

    <!-- Central Sensor Eye -->
    <circle cx="30" cy="30" r="4.5" fill="#080d1a" stroke="url(#logoSliceGrad)" stroke-width="1.8" />
    <circle cx="30" cy="30" r="2" fill="#22d3ee" filter="url(#logoGlow)" />

    <!-- Corner Accents -->
    <path d="M7 16 V9 H14" stroke="#22d3ee" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
    <path d="M53 44 V51 H46" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Typography: TRACELESS -->
  <text x="76" y="36" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3.5">TRACELESS</text>

  <!-- Subtitle Tagline -->
  <text x="77" y="49" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5">AI METADATA &amp; CAMERA CLOAK</text>
</svg>